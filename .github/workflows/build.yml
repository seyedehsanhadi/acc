name: build

on:
  push:
  workflow_dispatch:

# Read-only: this workflow builds and verifies, it no longer publishes anything.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # build.sh runs check-syntax.sh (bash -n on every *.sh) first, then packages the
      # flashable zip + tarball and regenerates the flashable uninstaller zip. Pure shell:
      # needs zip/tar/gzip/sed/find, all present on ubuntu-latest. No JDK/SDK required.
      - name: Build flashable zip + tarball
        run: |
          chmod +x build.sh check-syntax.sh 2>/dev/null || true
          # force a fresh uninstaller zip from the current uninstall.sh (git checkout equalizes mtimes,
          # so build.sh's "-ot" staleness check would otherwise skip regenerating it on CI)
          rm -f bin/acc_flashable_uninstaller.zip
          sh build.sh

      # check-syntax.sh is only `bash -n`, so until now every CI check could stay green while the
      # scripts were semantically broken -- the IA_ONLY mode that aborted on an unset variable would
      # have merged clean. The accd suites need Android (mksh, /data, /dev, sysfs, a real charger),
      # but the eight AMPS suites are portable and exercise the engine's real decision logic.
      - name: Run portable AMPS suites
        run: |
          sudo mkdir -p /data/local/tmp && sudo chmod 1777 /data/local/tmp
          fail=0
          for f in suites/amps/*.sh; do
            echo "---- $f"
            if AMPS="$PWD/acc-compat.sh" sh "$f"; then :; else fail=$((fail+1)); fi
          done
          echo "== $fail suite(s) failed"
          [ "$fail" -eq 0 ]

      # Catch the class the shell cannot: a Python file that does not parse, and a packer that
      # cannot verify its own output.
      - name: Verify the built zip
        run: |
          # The staged directory also holds acc_flashable_uninstaller.zip, which sorts first and
          # has no module.prop -- verifying THAT failed every build while never checking the module.
          z=$(ls _builds/*/*.zip | grep -v uninstaller | head -1)
          python3 build-zip.py --verify "$z"

      - name: Show outputs
        run: ls -R _builds bin 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: acc-flashable-zip
          path: |
            _builds/**/*.zip
            _builds/**/*.tgz
            bin/acc_flashable_uninstaller.zip

      # No rolling PUBLIC release. The build and the zip verification below still run on every
      # push -- that is the value -- but the outputs stay as workflow artifacts on the Actions run
      # instead of a Releases entry. A public rolling pre-release sat next to the tagged release
      # carrying near-identical filenames, and once dev moved past the tag it was AHEAD of the
      # supported build while still looking like it: someone downloads a dev build believing it is
      # the release. Only tagged releases are published now, by release.yml.
